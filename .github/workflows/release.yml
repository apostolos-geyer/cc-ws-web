name: Release

on:
  push:
    branches:
      - trunk

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun publish` reads .npmrc for the auth token (changesets/action only
      # writes it for npm publish, which we no longer use — workspace:*
      # protocol leaks through changeset's per-package npm publish).
      - name: Setup npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Codegen artifact gates — these don't require the claude binary;
      # they validate that the committed snapshots / generated types /
      # fixtures remain consistent with each other. Any patch edit that
      # breaks a previously-passing case fails CI deterministically here.
      - name: Codegen gates (check-gaps + verify-package + replay + tsc)
        run: bun codegen/ci-checks.ts

      - name: Test
        run: bun test

      # Two-mode action: pending changesets in `.changeset/` → opens (or
      # updates) a "Version Packages" PR that consumes them and bumps
      # versions. No pending changesets (PR was just merged) → runs
      # `release`, which builds + iterates packages/* with `bun publish`
      # (which natively rewrites `workspace:*` to the resolved version,
      # unlike `changeset publish`).
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
